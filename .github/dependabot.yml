version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    ignore:
      # majors move with an explicit AGP/Kotlin upgrade PR
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - "version-update:semver-major"
      # majors move with an explicit AGP/Kotlin upgrade PR
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-major"
      # majors move with an explicit AGP/Kotlin upgrade PR
      - dependency-name: "org.jetbrains.kotlin*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "gradle"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
