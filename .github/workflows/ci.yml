name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android command-line tools
        shell: bash
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip --output "$RUNNER_TEMP/android-tools.zip"
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/snapper-ci"
          "$ANDROID_HOME/cmdline-tools/snapper-ci/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Verify packaged translation catalogs
        run: bash scripts/check-packaged-locales.sh
      - name: Install Android 17 emulator
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/snapper-ci/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-37.0;google_apis;x86_64' < <(yes)
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/cmdline-tools/snapper-ci/bin/avdmanager" create avd --force --name snapper-ci --package 'system-images;android-37.0;google_apis;x86_64' --device pixel_6 < <(printf 'no\n')
      - name: Run Android 17 device tests
        shell: bash
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/emulator/emulator" -avd snapper-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 3072 -accel on > "$RUNNER_TEMP/snapper-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb -s "$ANDROID_SERIAL" emu kill || true; kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 240 bash -c 'until adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put system screen_off_timeout 1800000
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          SNAPPER_TEST_DEVICE_PIN=$(python3 -c 'import secrets; print(secrets.randbelow(900000) + 100000)')
          adb -s "$ANDROID_SERIAL" shell locksettings set-pin "$SNAPPER_TEST_DEVICE_PIN"
          adb -s "$ANDROID_SERIAL" shell locksettings verify --old "$SNAPPER_TEST_DEVICE_PIN"
          ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.device.serial=emulator-5554 "-Pandroid.testInstrumentationRunnerArguments.snapperTestDevicePin=$SNAPPER_TEST_DEVICE_PIN" :app:combinedDebugCoverageReport
      - name: Resolve Sonar analysis classpaths
        run: ./gradlew --no-daemon :app:writeSonarProperties
      - name: Require combined coverage report
        run: test -s app/build/reports/jacoco/combinedDebugCoverageReport/combinedDebugCoverageReport.xml
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dproject.settings=app/build/sonar/sonar-project.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            app/build/reports/jacoco/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/snapper-emulator.log
          if-no-files-found: ignore
          retention-days: 14
