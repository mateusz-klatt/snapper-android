sonar.projectKey=mateusz-klatt_snapper-android
sonar.organization=mateusz-klatt
sonar.projectName=Snapper Android
sonar.sourceEncoding=UTF-8
sonar.kotlin.source.version=2.4
sonar.java.source=17

# Analyze all owned files, classifying both test suites as test code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=app/src/test/**,app/src/androidTest/**

sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/combinedDebugCoverageReport/combinedDebugCoverageReport.xml
